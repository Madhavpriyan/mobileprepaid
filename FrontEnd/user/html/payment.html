<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - Prepaid Recharge</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/button.css">
  <style>
    /* Your existing styles remain unchanged */
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e0eafc, #cfdef3);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      padding-top: 70px;
    }
    .container {
      width: 100%;
      max-width: 550px;
      padding: 30px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: slideIn 0.5s ease-out;
    }
    @keyframes slideIn {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    h2 {
      color: #2c3e50;
      margin-bottom: 25px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .payment-summary {
      background: linear-gradient(145deg, #f7f9fc, #e8ecef);
      padding: 20px;
      border-radius: 15px;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
      margin-bottom: 30px;
      text-align: left;
      border: 1px solid #dfe6e9;
      transition: transform 0.3s ease;
    }
    .payment-summary:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }
    .payment-summary p {
      margin: 12px 0;
      color: #636e72;
      font-size: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .payment-summary p strong {
      color: #2d3436;
      font-weight: 600;
      font-size: 17px;
    }
    .payment-summary p span {
      background: #dfe6e9;
      padding: 5px 10px;
      border-radius: 10px;
      color: #2c3e50;
      font-weight: 500;
    }
    .btn-primary {
      background: linear-gradient(90deg, #0984e3, #00b894);
      color: #fff;
      padding: 12px 30px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 18px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(9, 132, 227, 0.4);
    }
    .btn-primary:hover {
      background: linear-gradient(90deg, #00b894, #0984e3);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(9, 132, 227, 0.6);
    }
    .btn-primary:disabled {
      background: #b2bec3;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    .btn-primary i {
      margin-right: 8px;
    }
    .payment-status {
      margin-top: 25px;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      font-size: 16px;
      font-weight: 500;
      transition: opacity 0.3s ease;
    }
    .payment-status.success {
      background: #c3e6cb;
      color: #155724;
      border: 1px solid #b8e0c1;
    }
    .payment-status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .blur-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      backdrop-filter: blur(5px);
    }
    .error {
      color: #d63031;
      font-weight: 600;
      font-size: 16px;
    }
    :root {
      --navbar-height: 70px;
      --navbar-bg: #ffffff;
      --navbar-shadow: rgba(0, 0, 0, 0.1);
      --primary: #f80e0e;
      --on-surface: #000;
      --font-weight-normal: 700;
      --font-weight-bold: 800;
    }
    .btn-change-plan {
      background: linear-gradient(90deg, #ff6f61, #ff8c00);
      color: #fff;
      padding: 12px 30px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 18px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(255, 111, 97, 0.4);
      margin-left: 15px;
    }
    .btn-change-plan:hover {
      background: linear-gradient(90deg, #ff8c00, #ff6f61);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(255, 111, 97, 0.6);
    }
    .btn-change-plan i {
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <header class="navbar" id="navbar">
    <div class="menu-toggle" id="menuToggle">☰</div>
    <a href="index.html" class="no-underline"><div class="logo">ReZap</div></a>
    <div class="nav-container" id="navContainer">
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="plans.html">Plans</a>
        <a href="offers.html">Offers</a>
        <a href="wallet.html">Wallet</a>
        <a href="support.html">Support</a>
      </nav>
    </div>
    <a href="login.html" id="loginNav">
      <button class="cta">
        <span><b>Login</b></span>
        <svg width="15px" height="10px" viewBox="0 0 13 10">
          <path d="M1,5 L11,5"></path>
          <polyline points="8 1 12 5 8 9"></polyline>
        </svg>
      </button>
    </a>
    <a href="profile.html" id="profileNav" style="display:none;">
      <button class="cta">
        <span><b>Profile</b></span>
        <svg width="15px" height="10px" viewBox="0 0 13 10">
          <path d="M1,5 L11,5"></path>
          <polyline points="8 1 12 5 8 9"></polyline>
        </svg>
      </button>
    </a>
  </header>

  <div class="container">
    <h2>Payment Summary</h2>
    <div id="paymentSummary" class="payment-summary">
      <p><strong>Mobile Number:</strong> <span id="mobileNumber"></span></p>
      <p><strong>Plan Name:</strong> <span id="planName"></span></p>
      <p><strong>Price:</strong> <span id="planPrice">₹</span></p>
      <p><strong>Validity:</strong> <span id="planValidity"></span></p>
    </div>
    <button id="payNowBtn" class="btn-primary">
      <i class="fas fa-credit-card"></i> Pay Now
    </button>
    <button id="changePlanBtn" class="btn-change-plan">
      <i class="fas fa-exchange-alt"></i> Change Plan
    </button>
    <div id="paymentStatus" class="payment-status" style="display: none;"></div>
  </div>

  <div id="blurOverlay" class="blur-overlay" style="display: none;"></div>

  <script>
    const API_BASE_URL = "http://localhost:8083"; // Backend API base URL
    const RETURN_URL_BASE = "http://localhost:5501/html"; // Frontend base URL (adjust if needed)

    // Update navbar based on login status
    function updateNavbar() {
      const loginNav = document.getElementById("loginNav");
      const profileNav = document.getElementById("profileNav");
      const token = localStorage.getItem("token");

      if (loginNav && profileNav) {
        loginNav.style.display = token ? "none" : "block";
        profileNav.style.display = token ? "block" : "none";
      }
    }

    // Load payment summary and handle events
    document.addEventListener("DOMContentLoaded", async () => {
      updateNavbar();
      await displayPaymentSummary();

      document.getElementById("payNowBtn").addEventListener("click", initiatePayment);
      document.getElementById("changePlanBtn").addEventListener("click", changePlan);

      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get("orderId");
      if (orderId) {
        await handlePaymentRedirect(orderId);
      }
    });

    window.addEventListener("storage", updateNavbar);

    // Display payment summary from localStorage or fetch from backend
    async function displayPaymentSummary() {
      const selectedPlan = JSON.parse(localStorage.getItem("selectedPlan"));
      const mobileNumber = localStorage.getItem("paymentMobileNumber");

      if (!selectedPlan || !mobileNumber) {
        document.getElementById("paymentSummary").innerHTML = `
          <p class="error">Error: Payment details not found. Please select a plan again.</p>
        `;
        document.getElementById("payNowBtn").disabled = true;
        document.getElementById("changePlanBtn").focus();
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/payment/summary?mobileNo=${mobileNumber}&planId=${selectedPlan.planId}`, {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
          },
        });

        if (!response.ok) {
          throw new Error("Failed to fetch payment summary");
        }

        const summary = await response.json();
        document.getElementById("mobileNumber").textContent = summary.mobileNo;
        document.getElementById("planName").textContent = summary.planDetails.planName;
        document.getElementById("planPrice").textContent = "₹" + summary.planDetails.planPrice;
        document.getElementById("planValidity").textContent = summary.planDetails.validity || "N/A";
      } catch (error) {
        console.error("Error fetching payment summary:", error);
        document.getElementById("mobileNumber").textContent = mobileNumber;
        document.getElementById("planName").textContent = selectedPlan.planName;
        document.getElementById("planPrice").textContent = "₹" + selectedPlan.planPrice;
        document.getElementById("planValidity").textContent = selectedPlan.validity || "N/A";
      }
    }

    // Initiate payment with Cashfree
    async function initiatePayment() {
      const selectedPlan = JSON.parse(localStorage.getItem("selectedPlan"));
      const mobileNumber = localStorage.getItem("paymentMobileNumber");
      const token = localStorage.getItem("token");
      const isGuestCheckout = localStorage.getItem("isGuestCheckout") === "true";

      if (!mobileNumber || !selectedPlan || !selectedPlan.planId) {
        showPaymentStatus("Error", "Missing payment details. Please select a plan again.", "error");
        setTimeout(() => redirectToPlans(), 2000);
        return;
      }

      if (!/^\d{10}$/.test(mobileNumber)) {
        showPaymentStatus("Error", "Invalid mobile number. Please enter a 10-digit number.", "error");
        setTimeout(() => redirectToPlans(), 2000);
        return;
      }

      const payload = {
        mobileNo: mobileNumber,
        planId: selectedPlan.planId,
        amount: selectedPlan.planPrice,
        isGuest: isGuestCheckout,
      };

      try {
        document.getElementById("payNowBtn").disabled = true;
        document.getElementById("payNowBtn").innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

        const response = await fetch(`${API_BASE_URL}/payment/initiate-payment`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            ...(token && { "Authorization": `Bearer ${token}` }),
          },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.message || "Failed to initiate payment");
        }

        const paymentData = await response.json();
        const { paymentSessionId, orderId } = paymentData;

        if (!paymentSessionId || !orderId) {
          throw new Error("Invalid response from server: Missing paymentSessionId or orderId");
        }

        const cashfree = Cashfree({ mode: "sandbox" }); // Change to "production" for live environment
        const paymentOptions = {
          paymentSessionId: paymentSessionId,
          returnUrl: `${RETURN_URL_BASE}/payment.html?orderId=${orderId}`,
          redirectTarget: "_self",
        };

        localStorage.setItem("pendingOrderId", orderId);

        cashfree.checkout(paymentOptions).then((result) => {
          if (result && result.error) {
            throw new Error(result.error.message || "Payment cancelled or failed.");
          }
        }).catch((error) => {
          console.error("Cashfree checkout error:", error);
          resetPayButton();
          showPaymentStatus("Payment Cancelled", "You cancelled the payment. Please try again.", "error");
          setTimeout(() => redirectToPlans(), 2000);
        });
      } catch (error) {
        console.error("Payment initiation error:", error);
        resetPayButton();
        showPaymentStatus("Error", error.message || "Unable to process payment. Please try again.", "error");
        setTimeout(() => redirectToPlans(), 2000);
      }
    }

    // Handle payment verification after redirect
    async function handlePaymentRedirect(orderId) {
      const mobileNumber = localStorage.getItem("paymentMobileNumber");
      const selectedPlan = JSON.parse(localStorage.getItem("selectedPlan"));
      const token = localStorage.getItem("token");

      if (!orderId || !mobileNumber || !selectedPlan || !selectedPlan.planId) {
        showPaymentStatus("Error", "Invalid redirect data. Please start over.", "error");
        setTimeout(() => redirectToPlans(), 2000);
        return;
      }

      try {
        document.getElementById("blurOverlay").style.display = "block";
        document.getElementById("payNowBtn").disabled = true;

        const response = await fetch(`${API_BASE_URL}/payment/verify-payment`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            ...(token && { "Authorization": `Bearer ${token}` }),
          },
          body: JSON.stringify({
            orderId: orderId,
            mobileNo: mobileNumber,
            planId: selectedPlan.planId,
          }),
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.message || "Verification failed");
        }

        const result = await response.json();

        if (result.status === "SUCCESS") {
          showPaymentStatus("Payment Successful", result.message || "Your recharge has been completed!", "success");
          cleanupLocalStorage();
          setTimeout(() => window.location.href = `${RETURN_URL_BASE}/index.html`, 3000);
        } else {
          showPaymentStatus("Payment Failed", result.message || "Transaction failed. Please try again.", "error");
          setTimeout(() => redirectToPlans(), 3000);
        }
      } catch (error) {
        console.error("Payment verification error:", error);
        showPaymentStatus("Error", error.message || "Payment verification failed. Contact support.", "error");
        setTimeout(() => window.location.href = `${RETURN_URL_BASE}/support.html`, 3000);
      } finally {
        document.getElementById("blurOverlay").style.display = "none";
        localStorage.removeItem("pendingOrderId");
      }
    }

    // Show payment status message
    function showPaymentStatus(title, message, type) {
      const statusDiv = document.getElementById("paymentStatus");
      statusDiv.innerHTML = `<h3>${title}</h3><p>${message}</p>`;
      statusDiv.className = `payment-status ${type}`;
      statusDiv.style.display = "block";
      document.getElementById("payNowBtn").disabled = true;
    }

    // Reset pay button
    function resetPayButton() {
      const payButton = document.getElementById("payNowBtn");
      payButton.disabled = false;
      payButton.innerHTML = '<i class="fas fa-credit-card"></i> Pay Now';
    }

    // Clean up localStorage
    function cleanupLocalStorage() {
      localStorage.removeItem("selectedPlan");
      localStorage.removeItem("paymentMobileNumber");
      localStorage.removeItem("isGuestCheckout");
      localStorage.removeItem("pendingOrderId");
    }

    // Redirect to plans page
    function changePlan() {
      redirectToPlans();
    }

    function redirectToPlans() {
      console.log(`Redirecting to: ${RETURN_URL_BASE}/plans.html`);
      window.location.href = `${RETURN_URL_BASE}/plans.html`;
    }
  </script>
</body>
</html>
